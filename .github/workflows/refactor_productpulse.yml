    def stage() -> str:
        if any(key in title_lower for key in ("start", "intro", "baseline", "setup", "how to use", "before you start")):
            return "setup"
        if any(key in title_lower for key in ("review", "progress", "next", "result", "completion", "retrospective")):
            return "review"
        if any(key in title_lower for key in ("lesson", "concept", "workflow", "core", "guide", "main")):
            return "practice"
        return "apply"

    section_stage = stage()

    def block(kind: str, block_title: str, body: str = "", *, items=None, columns=None, rows=None, evidence_ids=None):
        return {
            "kind": kind,
            "title": block_title,
            "body": body,
