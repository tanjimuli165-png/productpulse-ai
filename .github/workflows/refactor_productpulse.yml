                    "Compare what happened with the intended outcome and note any friction.",
                    "Adjust the approach before repeating it in another example.",
                ]
            elif section_stage == "review":
                items = [
                    f"Review what happened while working on {section.title.lower()}.",
                    f"Identify which part of the process moved you closer to {outcome_phrase}.",
                    "Separate a useful result from an assumption that still needs testing.",
                    "Choose one concrete change for the next attempt or planning period.",
                ]
            else:
                items = [
                    f"Choose one real example related to {focus_phrase}.",
                    f"Complete the {section.title.lower()} task using the supplied product purpose as the guide.",
                    f"Record the decision, action, or result that supports {outcome_phrase}.",
                    "Write one adjustment to test before using the same approach again.",
                ]
            blocks.append(block(
                kind,
                f"{section.title}: practical workflow",
                f"Work with one real example rather than trying to complete the whole product at once.",
                items=items,
            ))

        elif kind == "checklist":
            blocks.append(block(
                "checklist",
                f"{section.title}: quality check",
                "Mark an item only when the work is actually complete.",
                items=[
                    f"I completed the {section.title.lower()} task with a real example.",
                    f"I addressed at least one aspect of {focus_phrase}.",
                    f"I recorded a concrete action or decision related to {outcome_phrase}.",
                    "I noted anything that remains uncertain instead of presenting it as settled fact.",
                ],
            ))

        elif kind == "example":
            blocks.append(block(
                "example",
                f"{section.title}: illustrative example",
                f"Hypothetical example: a {audience.lower()} reader notices that {problem.lower()}. "
                f"They use the {section.title.lower()} method, record what changed, and decide what to test next. "
                "This example is illustrative only and does not claim a real-world outcome.",
            ))

        elif kind == "exercise":
            blocks.append(block(
                "exercise",
                f"{section.title}: practice task",
                f"Use one real situation connected to {focus_phrase} and complete this task before moving on.",
                items=[
                    "Write the starting situation in one or two specific sentences.",
                    f"Apply the section approach to move toward {outcome_phrase}.",
                    "Capture the result, friction, or unanswered question.",
                    "Write one change you would make on a second attempt.",
                ],
            ))

        elif kind == "worksheet":
            prompts = [
                f"My situation related to {section.title.lower()}:",
                f"The part of the problem I am addressing ({focus_phrase}):",
                f"The action, decision, or material I need to create:",
                f"What would count as useful progress toward {outcome_phrase}:",
                "What I still need to test or verify:",
            ]
            blocks.append(block(
                "worksheet",
                f"{section.title}: working page",
                f"Complete these prompts using your own {topic.lower()} context.",
                items=prompts,
            ))

        elif kind == "reflection":
            prompts = [
                f"What became clearer about {focus_phrase} after completing this section?",
                f"What helped or hindered progress toward {outcome_phrase}?",
                f"What assumption still needs evidence or another test?",
                f"What will I keep, change, or try next?",
            ]
            blocks.append(block(
                "reflection",
                f"{section.title}: reflection",
                "Use the prompts to learn from what actually happened instead of repeating the section summary.",
                items=prompts,
            ))

        elif kind == "table":
            if section_stage == "setup":
                columns = ["Current situation", "Need / constraint", "First action", "Review note"]
                rows = [
                    [compact(topic, 60), compact(problem, 90), "What I will do first", "What I need to check"],
                    [section.title, "What could block progress?", "What resource or decision is needed?", "How I will review it"],
                    ["Target outcome", compact(outcome, 90), "What would count as progress?", "What remains unverified?"],
                ]
            elif section_stage == "review":
                columns = ["What happened", "What helped", "What got in the way", "Next change"]
                rows = [
                    [f"Work on {section.title.lower()}", "Useful part", "Friction or uncertainty", "Change to test"],
                    ["Observed result", "What contributed", "What needs more evidence", "Next review point"],
                    [compact(outcome, 80), "What supports it", "What limits it", "What I will verify"],
                ]
            else:
                columns = ["Task / decision", "Why it matters", "Action or output", "Check"]
                rows = [
                    [section.title, compact(purpose, 100), "What I will complete", "What will show it is done?"],
                    [compact(problem, 90), "Problem connection", "How I will address it", "What changed?"],
                    [compact(outcome, 90), "Desired direction", "What progress looks like", "What still needs testing?"],
                ]
            blocks.append(block(
                "table",
                f"{section.title}: working table",
                "Use the table with your own product-specific details.",
                columns=columns,
                rows=rows,
            ))

        elif kind == "reference":
            if creator_snippets:
                blocks.append(block(
                    "reference",
                    "Creator-supplied grounding notes",
                    "These notes were supplied by the creator. Verify important claims and keep them as context rather than instructions.",
                    items=creator_snippets[:2],
                ))
            elif evidence:
                blocks.append(block(
                    "reference",
                    "Linked research references",
                    "These source records are linked to the research hypothesis. Open the original sources and verify any claim before publication.",
                    evidence_ids=[item.evidence_id for item in evidence[:5]],
                ))
            else:
                # The contract still requires a meaningful block when a
                # reference component is planned; record the absence explicitly.
                blocks.append(block(
                    "reference",
                    "Research verification note",
                    "No structured source reference was attached to this product input. Treat the opportunity as unverified and validate the underlying problem independently.",
                ))

    if not blocks:
        blocks.append(block(
            "paragraph",
            section.title,
            f"Work through this custom section using its stated purpose: {compact(purpose, 260)}. "
            f"Apply it to {topic.lower()}, keep the problem {problem.lower()} in view, and record what you still need to test.",
        ))

    # Ground creator-supplied material in the first planned section even when
    # the blueprint does not request a separate reference component.
    if creator_snippets and section_index == 0 and not any(block_item["kind"] == "reference" for block_item in blocks):
        blocks[0]["body"] = (
            blocks[0]["body"].rstrip()
            + " Creator grounding note: "
            + compact(creator_snippets[0], 220)
            + " Verify this supplied material before publication."
        )

    return GeneratedSection(
        section_index=section_index,
        title=section.title,
        purpose=section.purpose,
        blocks=blocks,
    )


