# Copy these entries into Streamlit Community Cloud -> App -> Settings -> Secrets.
# Do not commit the populated secrets file or paste it in public.
APP_STORAGE_BACKEND = "supabase"
SUPABASE_URL = "https://YOUR_PROJECT_REF.supabase.co"
SUPABASE_SERVICE_ROLE_KEY = "YOUR_SERVER_ONLY_SERVICE_ROLE_KEY"
# Use the project's direct or Session pooler URI. TLS is mandatory: sslmode may be require (default),
# verify-ca, or verify-full (add &sslrootcert=/path/to/supabase-ca.crt). See README "Database TLS modes".
SUPABASE_DB_URL = "postgresql://postgres.YOUR_PROJECT_REF:YOUR_DATABASE_PASSWORD@YOUR_POOLER_HOST:5432/postgres?sslmode=require"
SUPABASE_STORAGE_BUCKET = "digital-product-assets"

# Existing Product Builder AI configuration is independent of storage and optional
# until a user requests blueprint/content generation:
# OPENAI_API_KEY = "YOUR_MODEL_PROVIDER_KEY"
# PRODUCT_BUILDER_API_KEY = "YOUR_MODEL_PROVIDER_KEY"
# PRODUCT_BUILDER_API_BASE = "https://api.openai.com/v1"
# PRODUCT_BUILDER_MODEL = "gpt-5-mini"
